app {
  name = "concert-recommender-scala"
  timezone = "UTC"
}

kafka {
  bootstrapServers = "localhost:9092"
  subscribePattern = "wallet\\.ticket\\..*|events\\..*|recommendations\\.feedback"
  startingOffsets = "latest"
  failOnDataLoss = false
}

recommendation {
  halfLifeDays = 365.0
  alsCandidates = 100
  similarUsers = 100
  neighborCandidates = 100
  categoryCandidates = 100
  finalTopK = 10
  similarityDistanceThreshold = 1.25
  maxPerArtist = 1
  maxPerCategory = 2
}

als {
  rank = 64
  maxIter = 15
  regParam = 0.08
  alpha = 20.0
}

ranker {
  mode = "heuristic" # heuristic | gbt
  maxIter = 120
  maxDepth = 6
  stepSize = 0.05
  maturityDays = 7
  labelWindowDays = 30
}

paths {
  checkpointRoot = "/tmp/checkpoints/concert-recommender"
  alsModel = "/tmp/models/concert-recommender/als"
  rankerModel = "/tmp/models/concert-recommender/ranker"
}

output {
  publishToKafka = false
  kafkaTopic = "recommendations.concerts"
}

tables {
  bronzeKafka = "concert_rec.bronze.kafka_events"
  walletInteractions = "concert_rec.silver.wallet_interactions"
  priceHistory = "concert_rec.silver.price_history"
  eventCatalog = "concert_rec.silver.event_catalog"
  feedback = "concert_rec.silver.recommendation_feedback"

  userProfile = "concert_rec.features.user_profile"
  categoryProfile = "concert_rec.features.user_category_profile"
  eventFeatures = "concert_rec.features.event_features"
  impressions = "concert_rec.features.recommendation_impressions"
  rankerTraining = "concert_rec.features.ranker_training"
  recommendations = "concert_rec.gold.recommendations"
}
